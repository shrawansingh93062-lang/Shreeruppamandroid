name: Build Shree Ruppam APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: unzip -o shree_ruppam_android_project_cloud_build.zip

      - name: Build APK
        working-directory: ShreeRuppamAndroid
        run: gradle --no-daemon assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Shree-Ruppam-Admin-APK
          path: ShreeRuppamAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
